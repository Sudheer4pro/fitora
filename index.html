<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitora Gym Management</title>
    <meta name="description" content="Multi-tenant gym membership & subscription management software with vendor admin portal and isolated database partitioning." />
    <meta property="og:title" content="Fitora Gym Management" />
    <meta property="og:description" content="Multi-tenant gym membership & subscription management software with vendor admin portal and isolated database partitioning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(newFetch) {
              customFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return customFetch || originalFetch; },
                set: function(newFetch) { customFetch = newFetch; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        }
        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
